{% extends "base.html" %}

{% block title %}住所録一覧{% endblock %}

{% block content %}

<div class="bg-white p-6 rounded shadow">
<h2 class="text-xl font-bold mb-4">住所録一覧</h2>

<form method="GET" class="mb-4 flex gap-2">

    <input
    type="text"
    name="keyword"
    placeholder="例）山田 東京 半角で区切って入力"
    value="{{ request.args.get('keyword', '') }}"
    class="border rounded px-3 py-2 w-72">

    <span>生年月日：From</span>
    <input
    type="date"
    name="birthday_from"
    value="{{ request.args.get('birthday_from', '') }}"
    class="border rounded px-3 py-2">
    
    <span>To</span>
    <input
    type="date"
    name="birthday_to"
    value="{{ request.args.get('birthday_to', '') }}"
    class="border rounded px-3 py-2">    

    <button
    class="bg-blue-500 text-white px-4 py-2 rounded">
    検索
    </button>

</form>

<table class="min-w-full border">

    <thead class="bg-gray-200">
    
    <tr>
    <th class="border p-2">ID</th>
    <th class="border p-2">氏名</th>
    <th class="border p-2">年齢</th>
    <th class="border p-2">生年月日</th>
    <th class="border p-2">性別</th>
    <th class="border p-2">住所</th>
    <th class="border p-2">詳細</th>
    <th class="border p-2">編集</th>
    <th class="border p-2">削除</th>
    </tr>
    
    </thead>

    <tbody>
    
    {% for row in records %}
    
    <tr>
        <td class="border p-2">{{ row.id }}</td>
        <td class="border p-2">{{ row.name }}</td>
        <td class="border p-2">{{ row.age }}</td>
        <td class="border p-2">{{ row.birthday }}</td>
        <td class="border p-2">{{ row.gender }}</td>
        <td class="border p-2">{{ row.address }}</td>

        <td class="border p-2 text-center">
            <a href="/detail/{{ row.id }}" class="text-blue-500 hover:text-blue-700">詳細</a>
        </td>
        <td class="border p-2 text-center">
            <a href="/edit/{{ row.id }}" class="text-blue-500 hover:text-blue-700">編集</a>
        </td>
        <td class="border p-2 text-center">
            <a href="/delete/{{ row.id }}" class="text-red-500 hover:text-red-700">削除</a>
        </td>
    </tr>
    
    {% endfor %}
    
    </tbody>

</table>

</div>

{% endblock %}
