{% extends "base.html" %}

{% block title %}編集{% endblock %}

{% block content %}

<div class="bg-white p-6 rounded shadow">

<h2 class="text-xl font-bold mb-4">
住所録編集
</h2>

<form method="POST" class="space-y-4">


    <input
    type="text"
    name="name"
    value="{{ record.name }}"
    class="border rounded px-3 py-2 w-full">
    <br><br>    
    <input
    type="text"
    name="name"
    value="{{ record.kana }}"
    class="border rounded px-3 py-2 w-full">
    <br><br>    
    <input
    type="text"
    name="age"
    value="{{ record.age }}"
    class="border rounded px-3 py-2 w-full">
    <br><br>
    <input
    type="text"
    name="birthday"
    value="{{ record.birthday }}"
    class="border rounded px-3 py-2 w-full">
    <br><br>
    <select
    name="gender"
    value="{{ record.gender }}"
    required
    class="border rounded px-3 py-2 w-full"
    >
    <option value="男">男</option>
    <option value="女">女</option>
    <option value="不明">不明</option>
    </select>
    <br><br>    
    <select
    name="blood_type"
    value="{{ record.blood_type }}"
    required
    class="border rounded px-3 py-2 w-full"
    >
    <option value="A">A</option>
    <option value="B">B</option>
    <option value="AB">AB</option>
    <option value="O">O</option>
    </select>
    <br><br>    
    <input
    type="text"
    name="email"
    value="{{ record.email }}"
    class="border rounded px-3 py-2 w-full">
    <br><br>
    <input
    type="text"
    name="name"
    value="{{ record.tel }}"
    class="border rounded px-3 py-2 w-full">
    <br><br>    
    <input
    type="text"
    name="name"
    value="{{ record.mobile }}"
    class="border rounded px-3 py-2 w-full">
    <br><br>
    <input
    type="text"
    name="postal_code"
    value="{{ record.postal_code }}"
    class="border rounded px-3 py-2 w-full">
    <br><br>
    <input
    type="text"
    name="address"
    value="{{ record.address }}"
    class="border rounded px-3 py-2 w-full">
    <br><br>
    <input
    type="text"
    name="name"
    value="{{ record.company }}"
    class="border rounded px-3 py-2 w-full">
    <br><br>    

    <button class="bg-yellow-600 text-white px-6 py-2 rounded">更新</button>

</form>

</div>

{% endblock %}
